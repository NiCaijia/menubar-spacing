name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Apple Silicon app
        run: bash build.sh
      - name: Check isolated preferences and signature
        run: bash test.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/菜单栏间距.app' dist/MenuBarSpacing-arm64.zip
      - name: Package and verify DMG
        run: bash package-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MenuBarSpacing-arm64
          path: |
            dist/MenuBarSpacing-arm64.zip
            dist/MenuBarSpacing-*-arm64.dmg
            dist/MenuBarSpacing-*-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14
